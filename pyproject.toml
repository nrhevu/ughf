[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sadhi"
version = "0.1.0"
description = "A loss function designed for Image Quality Assessment (IQA) problems, balancing image fidelity, naturalness, and semantic context to optimize perceived image quality."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy",
    "matplotlib",
    "tqdm",
    "hydra-core",
    "pytest",
]

[tool.setuptools.packages.find]
# All the following settings are optional:
where = ["."]
include = ["sadhi*", "scripts*"]
# exclude = ["mypackage.tests*"]
namespaces = true

[tool.uv.sources]
sadhi = { workspace = true }

[dependency-groups]
dev = [
    "sadhi"
]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sapdi"
version = "0.1.0"
description = "A loss function designed for Image Quality Assessment (IQA) problems, balancing image fidelity, naturalness, and semantic context to optimize perceived image quality."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy",
    "matplotlib",
    "tqdm",
    "hydra-core",
    "pytest",
    "gdown>=5.2.0",
    "google-api-python-client>=2.187.0",
    "google-auth-httplib2>=0.2.1",
    "google-auth-oauthlib>=1.2.3",
    "opencv-python>=4.11.0.86",
    "ftfy>=6.3.1",
    "regex>=2025.11.3",
]

[tool.setuptools.packages.find]
# All the following settings are optional:
where = ["."]
include = ["sapdi*", "scripts*"]
# exclude = ["mypackage.tests*"]
namespaces = true

[tool.uv.sources]
sapdi = { workspace = true }

[dependency-groups]
dev = [
    "sapdi"
]
